name: Portfolio CI/CD
on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/lemanouthe/myporfolio

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          python backend/manage.py test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend build (vérifie la compilation)
        run: |
          npm ci
          npm run build
        working-directory: frontend

  # Build de l'image (front + back dans une image) et push sur GHCR.
  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3   # builder docker-container (cache gha)
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Prépare le serveur : génère le .env (depuis les secrets) et COPIE
  # .env + docker-compose.yml sur le serveur via scp (comme doum-auto).
  before-deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le .env
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        run: |
          chmod +x ./setup_env_prod.sh
          ./setup_env_prod.sh
      - name: Copier .env + docker-compose.yml sur le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "./.env,./docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/projects/myporfolio"

  # Déploiement : le serveur TIRE l'image (pas de build), scopé au projet.
  deploy:
    needs: before-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/projects/myporfolio
            mkdir -p static media logs
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose up -d --pull always --remove-orphans
            # Nettoyage SCOPÉ au projet portfolio (serveur partagé) :
            docker image prune -f || true
            docker container prune -f --filter "label=com.docker.compose.project=portfolio" || true
