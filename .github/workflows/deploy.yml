name: Portfolio CI/CD
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          python backend/manage.py test
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend build
        run: |
          npm ci
          npm run build
        working-directory: frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/projects/myporfolio || { echo "✗ Dossier introuvable — vérifie le chemin"; exit 1; }
            test -f docker-compose.yml || { echo "✗ Pas de docker-compose.yml dans $(pwd) — repo mal cloné ou mauvais dossier"; exit 1; }
            git pull origin main
            docker compose up -d --build
